<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>我的第一个AI</title>
<style>
  body { font-family: system-ui; max-width: 600px; margin: 30px auto; padding: 0 20px; background: #f5f5f5; }
  h1 { color: #333; }
  .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  #chat { height: 350px; overflow-y: auto; padding: 10px; background: #f9fafb; border-radius: 8px; margin-bottom: 15px; }
  .msg { margin: 10px 0; padding: 10px 14px; border-radius: 10px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { background: #4f46e5; color: white; margin-left: 60px; }
  .msg.ai { background: #e5e7eb; color: #111; margin-right: 60px; }
  .msg img { max-width: 200px; border-radius: 6px; margin-top: 5px; }
  .input-row { display: flex; gap: 8px; align-items: center; }
  input[type="text"] { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ddd; border-radius: 8px; }
  button { padding: 10px 18px; font-size: 15px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; }
  button:hover { background: #4338ca; }
  button:disabled { background: #aaa; }
  .img-preview { margin-top: 8px; }
  .img-preview img { max-height: 60px; border-radius: 6px; }
</style>
</head>
<body>

<h1>🤖 我的第一个AI（升级版）</h1>
<div class="box">
  <div id="chat"></div>

  <div class="img-preview" id="imgPreview" style="display:none">
    <img id="previewImg">
  </div>

  <div class="input-row">
    <input type="file" id="imgInput" accept="image/*" style="display:none">
    <button onclick="document.getElementById('imgInput').click()" title="上传图片">📎</button>
    <input type="text" id="question" placeholder="问点什么...">
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</div>

<script>
// ========== 你的配置 ==========
const apiKey = "sk-a2a8ee252c1244098ca7dc6c05655fcf";  // ← 把你的 sk-xxx 粘到这里

const TEXT_MODEL = "deepseek-chat";
const VL_MODEL = "deepseek-vl";
const url = "https://api.deepseek.com/chat/completions";

let messages = [];
let selectedImage = null;

const chatBox = document.getElementById("chat");
const imgInput = document.getElementById("imgInput");
const imgPreview = document.getElementById("imgPreview");
const previewImg = document.getElementById("previewImg");

imgInput.onchange = () => {
    const file = imgInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        selectedImage = e.target.result;
        previewImg.src = selectedImage;
        imgPreview.style.display = "block";
    };
    reader.readAsDataURL(file);
};

function addMessage(role, text, imgUrl) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (imgUrl) {
        div.innerHTML = text + '<br><img src="' + imgUrl + '">';
    } else {
        div.textContent = text;
    }
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
}

async function send() {
    const question = document.getElementById("question").value.trim();
    if (!question && !selectedImage) return;

    addMessage("user", question, selectedImage);

    const content = [];
    if (question) content.push({ type: "text", text: question });
    if (selectedImage) content.push({ type: "image_url", image_url: { url: selectedImage } });
    messages.push({ role: "user", content: content.length === 1 && question ? question : content });

    document.getElementById("question").value = "";
    imgInput.value = "";
    imgPreview.style.display = "none";
    selectedImage = null;

    const aiDiv = addMessage("ai", "");
    document.getElementById("sendBtn").disabled = true;

    const model = selectedImage ? VL_MODEL : TEXT_MODEL;

    try {
        const response = await fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + apiKey
            },
            body: JSON.stringify({
                model: model,
                messages: messages,
                stream: true
            })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let aiText = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            const lines = chunk.split("\n");
            for (const line of lines) {
                if (!line.startsWith("data: ")) continue;
                const data = line.slice(6);
                if (data === "[DONE]") continue;
                try {
                    const json = JSON.parse(data);
                    const delta = json.choices[0].delta.content;
                    if (delta) {
                        aiText += delta;
                        aiDiv.textContent = aiText;
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                } catch (e) {}
            }
        }

        messages.push({ role: "assistant", content: aiText });

    } catch (err) {
        aiDiv.textContent = "出错了：" + err.message;
    }

    document.getElementById("sendBtn").disabled = false;
}

document.getElementById("question").addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
});

</script>

</body>
</html>
